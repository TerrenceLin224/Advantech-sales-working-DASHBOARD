<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#00559F">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="帳戶情報">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>帳戶情報系統 v3｜台積電生態系</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@500;600&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{--paper:#EDF1F4;--panel:#FFF;--rail:#D3DCE3;--soft:#E4EAEF;
--ink:#141E28;--ink2:#3D4C59;--muted:#77858F;--faint:#9AA6AF;
--blue:#00559F;--run:#2E7D32;--warn:#C77C13;--fault:#B23A2E;--violet:#6B4E9B;--teal:#0F7A72;--slate:#334654}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:"Noto Sans TC",system-ui,-apple-system,"PingFang TC",sans-serif;font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
.wrap{max-width:960px;margin:0 auto;padding:14px 12px 96px}
.hd{background:var(--panel);border:1px solid var(--rail);border-radius:3px;padding:13px 15px;margin-bottom:10px;position:relative}
.hd::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:linear-gradient(180deg,var(--blue) 0 55%,var(--run) 55% 100%)}
.eb{font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.16em;color:var(--muted);text-transform:uppercase;font-weight:600}
h1{font-family:"Barlow Condensed","Noto Sans TC",sans-serif;font-size:27px;line-height:1;font-weight:700;margin:3px 0 1px}
.zh{font-weight:900;font-size:17px;letter-spacing:-.02em;margin:0}
.tabs{display:flex;gap:4px;overflow-x:auto;margin-bottom:11px;padding-bottom:2px;-webkit-overflow-scrolling:touch}
.tab{flex:none;padding:9px 13px;font-size:12.5px;font-weight:700;color:var(--ink2);background:var(--panel);border:1px solid var(--rail);border-radius:3px;cursor:pointer;font-family:inherit;white-space:nowrap}
.tab.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.tab .b{display:inline-block;margin-left:5px;font-family:"IBM Plex Mono",monospace;font-size:9.5px;opacity:.75}
.card{background:var(--panel);border:1px solid var(--rail);border-radius:3px;padding:13px 14px;margin-bottom:10px}
.card h2{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);margin:0 0 10px;font-weight:600}
label{display:block;font-size:11.5px;font-weight:700;color:#22303C;margin:8px 0 3px}
input,select,textarea{width:100%;padding:9px 10px;font-size:13.5px;font-family:inherit;color:var(--ink);border:1px solid var(--rail);border-radius:3px;background:#FCFDFE;outline:none}
textarea{resize:vertical;line-height:1.6;min-height:38px}
input:focus,select:focus,textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(0,85,159,.09);background:#fff}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
@media(max-width:560px){.g2,.g3{grid-template-columns:1fr}}
.btn{padding:10px 14px;font-size:11.5px;font-weight:600;letter-spacing:.04em;color:var(--ink2);background:var(--panel);border:1px solid var(--rail);border-radius:3px;cursor:pointer;font-family:"IBM Plex Mono",monospace;white-space:nowrap}
.btn:hover{border-color:var(--blue);color:var(--blue)}
.btn.p{background:var(--blue);color:#fff;border-color:var(--blue)}
.btn.p:hover{background:#00447F;color:#fff}
.btn.d{color:var(--fault);border-color:#E8CFCB}
.btn.sm{padding:5px 9px;font-size:10px}
.row{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
#raw{min-height:130px;font-size:15px;line-height:1.75}
.ib{border:1px solid var(--soft);border-left:3px solid var(--warn);border-radius:3px;padding:10px 11px;margin-bottom:7px;background:#FFFDF8}
.ib.done{border-left-color:var(--run);background:#F6FAF6;opacity:.62}
.ib-t{font-size:13.5px;line-height:1.7;white-space:pre-wrap;word-break:break-word}
.ib-m{font-family:"IBM Plex Mono",monospace;font-size:9.5px;color:var(--faint);margin-top:5px}
.att{display:inline-flex;align-items:center;gap:4px;font-size:11px;background:#EAF1F7;color:#00447F;padding:3px 7px;border-radius:2px;margin:5px 5px 0 0;text-decoration:none;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:3px}
.ck{position:relative}
.ck input{position:absolute;opacity:0;pointer-events:none}
.ck span{display:inline-block;padding:6px 9px;font-size:11px;font-weight:600;border:1px solid var(--rail);border-radius:3px;cursor:pointer;background:#FCFDFE;color:var(--ink2)}
.ck input:checked+span{background:var(--blue);color:#fff;border-color:var(--blue)}
.ck.fac input:checked+span{background:var(--run);border-color:var(--run)}
.chip{font-family:"IBM Plex Mono",monospace;font-size:9px;font-weight:600;padding:2px 6px;border-radius:2px;display:inline-block}
.c1{background:#E0EBF5;color:#00447F}.c2{background:#E6EFE6;color:#1F6323}
.c3{background:#FBEDD8;color:#8A5405}.c4{background:#F6E4EE;color:#8A2557}
.c5{background:#EEE9F5;color:#4E3778}.c6{background:#F0F1F2;color:#4C5A66}
.c7{background:#FAE0DC;color:#8C2C21}
.ent{border:1px solid var(--rail);border-left:4px solid var(--ec,var(--rail));border-radius:3px;padding:10px 11px;margin-bottom:7px;background:#fff}
.ent-n{font-size:14px;font-weight:700}
.ent-s{font-size:11.5px;color:var(--muted);margin-top:1px}
.ent-b{font-size:11.5px;color:var(--ink2);margin-top:6px;line-height:1.6}
.ent-b b{color:var(--warn);font-weight:600}
.ent-f{font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--ink2);margin-top:5px;line-height:1.7}
.mini{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
a.lnk{color:var(--blue);text-decoration:none;font-weight:600}
.tbl{width:100%;border-collapse:collapse;font-size:12px}
.tbl th{background:var(--blue);color:#fff;font-weight:700;text-align:left;padding:7px 8px;font-size:11px;white-space:nowrap}
.tbl th.g{background:var(--run)}
.tbl td{padding:7px 8px;border-bottom:1px solid var(--soft);vertical-align:top;line-height:1.55}
.tbl tr:nth-child(even) td{background:#F7F9FB}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -14px;padding:0 14px}
.alert{border-left:4px solid var(--fault);background:#FDF6F5;padding:9px 11px;border-radius:3px;font-size:12.5px;line-height:1.7;margin-bottom:7px;color:#7A2A20}
.alert.ok{border-left-color:var(--run);background:#F4F9F4;color:#1F5522}
.alert.info{border-left-color:var(--blue);background:#F4F8FC;color:#00447F}
.alert b{font-weight:700}
.empty{padding:24px 10px;text-align:center;color:var(--muted);font-size:13px}
.hint{font-size:11px;color:var(--muted);line-height:1.6;margin-top:3px}
.bar{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.97);border-top:1px solid var(--rail);padding:8px 12px;display:flex;gap:6px;justify-content:center;backdrop-filter:blur(8px);z-index:9}
#out{min-height:200px;font-family:"IBM Plex Mono",monospace;font-size:11px;line-height:1.65}
.trk{display:inline-block;font-size:10px;font-weight:700;padding:2px 7px;border-radius:2px;margin-right:6px}
.trk.f{background:#E6EFE6;color:#1F6323}
.trk.p{background:#EEE9F5;color:#4E3778}
.gh{font-size:12.5px;font-weight:700;color:var(--slate);margin:14px 0 6px;padding-bottom:4px;border-bottom:1px solid var(--soft)}
</style>
</head>
<body>
<div class="wrap">
<div class="hd">
  <div class="eb">ADVANTECH · ACCOUNT INTELLIGENCE · v3 雙軌</div>
  <h1>ACCOUNT INTEL</h1>
  <div class="zh">台積電生態系情報系統</div>
  <div id="stMsg" style="font-size:11px;color:#B23A2E;margin-top:4px"></div>
</div>
<div class="tabs" id="tabs"></div>
<div id="view"></div>
</div>
<div class="bar">
  <button class="btn" id="bExp">匯出備份</button>
  <button class="btn" id="bImp">匯入</button>
  <button class="btn p" id="bInbox">＋ 快記</button>
</div>

<script>
const K='adv_intel_v4';
let D={inbox:[],companies:[],people:[],fabs:[],opps:[],visits:[],log:[]};
let tab='inbox', edit={};

const CTYPE=['廠務統包/機電','廠務子系統','FMCS/監控整合','AMHS/物流自動化','能源/環安監測',
 '設備商-台系','設備商-進口','視覺檢測','軟體ISV','通路商','終端客戶','其他'];
const CCOL={'廠務統包/機電':'var(--teal)','廠務子系統':'var(--run)','FMCS/監控整合':'var(--blue)',
 'AMHS/物流自動化':'var(--warn)','能源/環安監測':'var(--run)','設備商-台系':'var(--slate)',
 '設備商-進口':'var(--violet)','視覺檢測':'var(--warn)','軟體ISV':'var(--slate)',
 '通路商':'var(--muted)','終端客戶':'var(--fault)','其他':'var(--rail)'};

/* 雙軌：廠務段（主戰場）／製程段（多數打不到） */
const FAC=['空調/無塵室 HVAC-MAU-FFU','超純水 UPW','廢水處理','廢氣處理','大宗氣體','特殊氣體',
 '化學品供應 CCSS','電力/受電/UPS','FMCS 廠務中控','EMS 能源管理','AMHS 天車搬運','環境安全監測','消防/氣體偵測'];
const PROC=['微影曝光','塗佈顯影','蝕刻','薄膜沉積','ALD','CMP','離子植入','擴散熱製程','清洗','量測檢測','測試','封裝'];

const DECLOC=['台灣','日本','荷蘭','美國','韓國','其他','未知'];
const PHASE=['土建','機電','廠務','設備搬入','試產','量產','未知'];
const ROLES=[{k:'eb',n:'決策者',c:'c3'},{k:'tb',n:'技術把關',c:'c1'},{k:'ub',n:'使用單位',c:'c2'},{k:'co',n:'內部教練',c:'c4'},{k:'gk',n:'守門人',c:'c5'}];
const STANCE={3:['支持','c2'],2:['中立','c6'],1:['反對','c7'],0:['未知','c3']};
const RELN=['未接觸','見過面','熟識','信任'];
const STAGE=['情報','接觸中','需求確認','PoC/送樣','報價','成交','失單'];
const SCOL={'情報':'c6','接觸中':'c1','需求確認':'c3','PoC/送樣':'c5','報價':'c4','成交':'c2','失單':'c7'};

const uid=p=>p+Math.random().toString(36).slice(2,8);
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
const co=id=>D.companies.find(x=>x.id===id);
const fb=id=>D.fabs.find(x=>x.id===id);
const isUrl=s=>/^https?:\/\//i.test(String(s||'').trim());
const isFac=c=>(c.fac||[]).length>0;
const isProc=c=>(c.proc||[]).length>0;

function zodiac(md){
  const p=String(md).split('-'); const m=+p[0], d=+p[1];
  if(!m||!d)return '';
  const cut=[[20,'摩羯','射手'],[19,'水瓶','摩羯'],[21,'雙魚','水瓶'],[20,'牡羊','雙魚'],[21,'金牛','牡羊'],[22,'雙子','金牛'],
    [23,'巨蟹','雙子'],[23,'獅子','巨蟹'],[23,'處女','獅子'],[24,'天秤','處女'],[23,'天蠍','天秤'],[22,'射手','天蠍']][m-1];
  return d>=cut[0]?cut[1]:cut[2];
}

/* 儲存層：localStorage 為主（GitHub Pages / 手機都能用），
   window.storage 只在 Claude 預覽環境內當備援同步 */
let STOK=true;
async function save(){
  const v=JSON.stringify(D);
  try{localStorage.setItem(K,v);STOK=true}catch(e){STOK=false}
  try{if(window.storage&&window.storage.set)await window.storage.set(K,v)}catch(e){}
  const el=document.getElementById('stMsg');
  if(el)el.textContent=STOK?'':'⚠ 無法寫入本機儲存，請勿使用無痕模式';
}
async function load(){
  let v=null;
  try{v=localStorage.getItem(K)}catch(e){STOK=false}
  if(!v){try{const r=await window.storage.get(K);if(r&&r.value)v=r.value}catch(e){}}
  if(v){try{D=Object.assign(D,JSON.parse(v))}catch(e){}}
}

const TABS=[['inbox','收件匣',()=>D.inbox.filter(i=>!i.done).length],
 ['vi','拜訪',()=>D.visits.length],['dr','日報',()=>null],
 ['co','公司',()=>D.companies.length],['pe','人',()=>D.people.length],
 ['fa','廠區',()=>D.fabs.length],['op','機會',()=>D.opps.length],['rp','報表',()=>null]];

function tabsHTML(){
  document.getElementById('tabs').innerHTML=TABS.map(t=>{
    const n=t[2]();
    return `<button class="tab ${tab===t[0]?'on':''}" data-tab="${t[0]}">${t[1]}${n!==null&&n>0?`<span class="b">${n}</span>`:''}</button>`;
  }).join('');
  document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;edit={};render()});
}

function vInbox(){
  const pend=D.inbox.filter(i=>!i.done), dn=D.inbox.filter(i=>i.done);
  return `<div class="card">
   <h2>快記 — 想到什麼就丟</h2>
   <textarea id="raw" placeholder="散記、逐字稿、會議重點都可以貼進來"></textarea>
   <div class="g2">
     <div><label>附件參考（檔名或雲端連結）</label><input id="attn" placeholder="Recording_0901.m4a 或 https://drive..."></div>
     <div><label>來源</label><select id="atts"><option>手記</option><option>錄音逐字稿</option><option>會議紀錄</option><option>Email</option><option>文件</option><option>其他</option></select></div>
   </div>
   <div class="row"><button class="btn p" id="addRaw">存入收件匣</button></div>
   <div class="alert info" style="margin-top:11px"><b>錄音：</b>Pixel 逐字稿全文貼進上框，音檔留雲端、連結貼附件欄。要自動拆成結構化資料，把全文貼給 Claude 產生 JSON 後用「匯入」。</div>
  </div>
  <div class="card"><h2>待整理 ${pend.length}</h2>
   ${pend.length?pend.map(i=>`<div class="ib">
     <div class="ib-t">${esc(i.t)}</div>
     ${i.att?`<div>${isUrl(i.att)?`<a class="att" href="${esc(i.att)}" target="_blank" rel="noopener">🔗 ${esc(i.att).slice(0,44)}</a>`:`<span class="att">📎 ${esc(i.att)}</span>`}</div>`:''}
     <div class="ib-m">${i.d}${i.src?' · '+esc(i.src):''}</div>
     <div class="row">
       <button class="btn sm" data-toco="${i.id}">→ 公司</button><button class="btn sm" data-tope="${i.id}">→ 人</button>
       <button class="btn sm" data-tofa="${i.id}">→ 廠區</button><button class="btn sm" data-toop="${i.id}">→ 機會</button>
       <button class="btn sm" data-tovi="${i.id}">→ 拜訪</button>
       <button class="btn sm" data-ibdone="${i.id}">完成</button><button class="btn sm d" data-ibdel="${i.id}">刪</button>
     </div></div>`).join(''):'<div class="empty">收件匣清空了</div>'}
  </div>
  ${dn.length?`<div class="card"><h2>已整理 ${dn.length}（近 8 筆）</h2>
    ${dn.slice(-8).reverse().map(i=>`<div class="ib done"><div class="ib-t">${esc(i.t).slice(0,150)}${i.t.length>150?'…':''}</div>
    <div class="ib-m">${i.d}<button class="btn sm d" style="margin-left:8px" data-ibdel="${i.id}">刪</button></div></div>`).join('')}</div>`:''}`;
}

function vCo(){
  const e=edit.co||{};
  return `<div class="card">
   <h2>${e.id?'編輯公司':'新增公司'}</h2>
   <div class="g2">
    <div><label>公司名稱</label><input id="c_name" value="${esc(e.name)}"></div>
    <div><label>類型</label><select id="c_type">${CTYPE.map(t=>`<option ${e.type===t?'selected':''}>${t}</option>`).join('')}</select></div>
   </div>
   <div class="g2">
    <div><label>官網</label><input id="c_web" value="${esc(e.web)}" placeholder="https://..."></div>
    <div><label>地址</label><input id="c_addr" value="${esc(e.addr)}"></div>
   </div>
   <div class="g3">
    <div><label>實收資本額</label><input id="c_cap" value="${esc(e.cap)}"></div>
    <div><label>員工人數</label><input id="c_emp" value="${esc(e.emp)}"></div>
    <div><label>近一年營收</label><input id="c_rev" value="${esc(e.rev)}"></div>
   </div>
   <div class="hint">上市櫃可在公開資訊觀測站查資本額、員工數、營收與主要客戶揭露</div>

   <div class="gh"><span class="trk f">廠務段</span>主戰場 — 台灣設計、台灣發包、台灣決定</div>
   <label>負責哪些廠務系統（可複選）</label>
   <div class="chips">${FAC.map(s=>`<label class="ck fac"><input type="checkbox" class="c_fac" value="${s}" ${(e.fac||[]).includes(s)?'checked':''}><span>${s}</span></label>`).join('')}</div>

   <div class="gh"><span class="trk p">製程段</span>多數選型在海外 — 主要盯既有機台 refresh</div>
   <label>負責哪些製程站別（可複選）</label>
   <div class="chips">${PROC.map(s=>`<label class="ck"><input type="checkbox" class="c_proc" value="${s}" ${(e.proc||[]).includes(s)?'checked':''}><span>${s}</span></label>`).join('')}</div>

   <div class="gh">決策與現況</div>
   <label>服務哪些廠區（可複選）</label>
   <div class="chips">${D.fabs.length?D.fabs.map(f=>`<label class="ck"><input type="checkbox" class="c_fb" value="${f.id}" ${(e.fabs||[]).includes(f.id)?'checked':''}><span>${esc(f.name)}</span></label>`).join(''):'<span class="hint">還沒建廠區</span>'}</div>
   <div class="g3">
    <div><label>運算/控制器選型地點</label><select id="c_loc">${DECLOC.map(t=>`<option ${e.loc===t?'selected':''}>${t}</option>`).join('')}</select>
      <div class="hint">非台灣＝這條線不用打</div></div>
    <div><label>目前用誰的控制器/IPC</label><input id="c_ipc" value="${esc(e.ipc)}" placeholder="凌華／Beckhoff／西門子／白牌"></div>
    <div><label>是否已是研華客戶</label><select id="c_adv">
      <option value="" ${!e.adv?'selected':''}>未知</option>
      <option value="yes" ${e.adv==='yes'?'selected':''}>是（有出貨）</option>
      <option value="no" ${e.adv==='no'?'selected':''}>否</option></select></div>
   </div>
   <div class="g2">
    <div><label>OS／韌體現況（refresh 時機判斷）</label><input id="c_os" value="${esc(e.os)}" placeholder="Win10 LTSC 2021，2027 EOL"></div>
    <div><label>下次標案／改版時程</label><input id="c_next" value="${esc(e.next)}" placeholder="2027 Q1 發包"></div>
   </div>
   <label>痛點／備註</label><textarea id="c_note">${esc(e.note)}</textarea>
   <div class="row"><button class="btn p" id="coSave">${e.id?'儲存':'新增'}</button>${e.id?'<button class="btn" id="coCancel">取消</button>':''}</div>
  </div>
  <div class="card"><h2>公司 ${D.companies.length}　<span style="color:var(--run)">廠務 ${D.companies.filter(isFac).length}</span> · <span style="color:var(--violet)">製程 ${D.companies.filter(isProc).length}</span></h2>
   ${D.companies.length?D.companies.map(c=>{
     const ppl=D.people.filter(p=>p.co===c.id);

function vRp(){
  const a=[];
  const facCo=D.companies.filter(isFac);
  const noWin=D.companies.filter(c=>!D.people.some(p=>p.co===c.id));
  const one=D.companies.filter(c=>D.people.filter(p=>p.co===c.id).length===1);
  const advNo=D.companies.filter(c=>c.adv==='yes'&&!D.opps.some(o=>o.co===c.id));
  const noCoach=D.companies.filter(c=>D.people.some(p=>p.co===c.id)&&!D.people.some(p=>p.co===c.id&&(p.roles||[]).includes('co')));
  const facGap=FAC.filter(s=>!D.companies.some(c=>(c.fac||[]).includes(s)));
  const osRef=D.companies.filter(c=>c.os);

  if(advNo.length)a.push(['ok',`<b>最快的第一單：</b>${advNo.length} 家已是研華客戶但無機會單 — ${advNo.slice(0,6).map(c=>esc(c.name)).join('、')}`]);
  if(facCo.length)a.push(['ok',`<b>廠務段已覆蓋 ${facCo.length} 家</b>（主戰場）`]);
  if(facGap.length)a.push(['bad',`<b>廠務系統還有 ${facGap.length} 項沒有任何公司：</b>${facGap.slice(0,8).join('、')}${facGap.length>8?'…':''}`]);
  if(noWin.length)a.push(['bad',`<b>${noWin.length} 家沒有任何窗口：</b>${noWin.slice(0,6).map(c=>esc(c.name)).join('、')}`]);
  if(one.length)a.push(['bad',`<b>單一窗口風險 ${one.length} 家：</b>${one.slice(0,6).map(c=>esc(c.name)).join('、')}`]);
  if(noCoach.length)a.push(['bad',`<b>${noCoach.length} 家沒有內部教練</b>`]);
  if(!osRef.length)a.push(['bad',`<b>還沒有任何 OS/韌體現況紀錄</b> — refresh 商機要靠這個推算`]);
  if(!a.length)a.push(['ok','資料還太少，先建幾家公司與窗口']);

  return `<div class="card"><h2>覆蓋率體檢</h2>${a.map(x=>`<div class="alert ${x[0]==='ok'?'ok':''}">${x[1]}</div>`).join('')}</div>

     return `<tr><td><b>${esc(f.name)}</b><br><span style="color:var(--muted)">${esc(f.loc)}</span></td>
     <td>${esc(f.node)}</td><td>${esc(f.ph)}</td><td>${esc(f.mp)}</td>
     <td>${cs.map(c=>esc(c.name)).join('<br>')||'—'}</td><td>${esc(f.adv)||'—'}</td></tr>`}).join(''):'<tr><td colspan="6" style="text-align:center;color:var(--muted);padding:18px">尚無資料</td></tr>'}

     if(!cs.length)return `<tr><td><b>${s}</b></td><td colspan="5" style="color:var(--fault)">尚無資料 — 待蒐集</td></tr>`;

function genReport(from,to,weekly){
  const vs=D.visits.filter(v=>v.d>=from&&v.d<=to).sort((a,b)=>(a.d||'').localeCompare(b.d||''));
  const lg=D.log.filter(x=>x.d>=from&&x.d<=to);
  let s=weekly?`【週報】${from} ~ ${to}\n`:`【日報】${from}\n`;
  s+=`拜訪 ${vs.length} 場｜資料更新 ${lg.length} 筆\n`;

  if(vs.length){
    s+=`\n═══ 拜訪紀錄（貼 Salesforce Activity）═══\n`;
    vs.forEach(v=>{
      const c=co(v.co),f=fb(v.fa);
      const ppl=(v.pe||[]).map(id=>{const p=D.people.find(x=>x.id===id);return p?p.name+(p.title?'/'+p.title:''):''}).filter(Boolean);
      s+=`\n─────────────────────\n`;
      s+=`Account：${c?c.name:'（未指定）'}\n`;
      s+=`Date：${v.d}　Type：${v.vt}\n`;
      if(f)s+=`Fab：${f.name}\n`;
      if(ppl.length)s+=`Contacts：${ppl.join('、')}\n`;
      s+=`\nSubject：${v.vt}${c?' - '+c.name:''}\n`;
      s+=`Comments：\n`;
      const a=v.a||{};
      Object.keys(a).forEach(k=>{if(a[k]&&a[k].trim())s+=`  ・${k}：${a[k].trim().replace(/\n/g,' ')}\n`});
      if(v.free)s+=`  ・其他：${v.free.trim().replace(/\n/g,' ')}\n`;
      if(v.next)s+=`\nNext Step：${v.next.trim().replace(/\n/g,' ')}\n`;
      if(v.nd)s+=`Next Contact：${v.nd}\n`;
      if(v.sf)s+=`\n★ SF 待更新：${v.sf.trim().replace(/\n/g,' ')}\n`;
      const miss=(ASK[v.vt]||[]).map(q=>q[0]).filter(k=>!(a[k]&&a[k].trim()));
      if(miss.length)s+=`\n（還沒問到：${miss.join('、')}）\n`;
    });
  }

  const opUp=lg.filter(x=>x.k==='op');
  if(opUp.length){
    s+=`\n═══ 商機異動（貼 Salesforce Opportunity）═══\n`;
    opUp.forEach(x=>{
      const o=D.opps.find(y=>y.id===x.rid);
      if(!o)return;
      const c=co(o.co),f=fb(o.fa);
      s+=`\nOpportunity：${o.t}\n  Account：${c?c.name:'—'}${f?'　Fab：'+f.name:''}\n`;
      s+=`  Stage：${o.sg}${o.v?'　Amount：'+o.v:''}${o.pd?'　Product：'+o.pd:''}\n`;
      if(o.next)s+=`  Next Step：${o.next.replace(/\n/g,' ')}\n`;
      s+=`  （${x.a}）\n`;
    });
  }

  const coUp=lg.filter(x=>x.k==='co');
  if(coUp.length){
    s+=`\n═══ 帳戶異動（貼 Salesforce Account）═══\n`;
    const seen=new Set();
    coUp.forEach(x=>{
      if(seen.has(x.rid))return; seen.add(x.rid);
      const c=co(x.rid); if(!c)return;
      s+=`\nAccount：${c.name}${c.web?'　'+c.web:''}\n`;
      s+=`  類型：${c.type}${c.loc?'　選型地：'+c.loc:''}${c.ipc?'　現用：'+c.ipc:''}\n`;
      if(c.next)s+=`  下次時程：${c.next}\n`;
      s+=`  （${x.a}）\n`;
    });
  }

  const peUp=lg.filter(x=>x.k==='pe');
  if(peUp.length){
    s+=`\n═══ 聯絡人異動（貼 Salesforce Contact）═══\n`;
    const seen=new Set();
    peUp.forEach(x=>{
      if(seen.has(x.rid))return; seen.add(x.rid);
      const p=D.people.find(y=>y.id===x.rid); if(!p)return;
      const c=co(p.co);
      s+=`\nContact：${p.name}${p.title?' / '+p.title:''}\n`;
      s+=`  Account：${c?c.name:'—'}${p.dept?'　Dept：'+p.dept:''}\n`;
      if(p.tel||p.mail)s+=`  ${p.tel||''} ${p.mail||''}\n`;
      s+=`  （${x.a}）\n`;
    });
  }

  if(weekly){
    const nx=D.visits.filter(v=>v.nd&&v.nd>to).sort((a,b)=>(a.nd||'').localeCompare(b.nd||''));
    if(nx.length){
      s+=`\n═══ 下週預定 ═══\n`;
      nx.slice(0,12).forEach(v=>{const c=co(v.co);s+=`  ${v.nd}　${c?c.name:'—'}　${(v.next||'').replace(/\n/g,' ').slice(0,50)}\n`});
    }
    const gap=[];
    const facGap=FAC.filter(x=>!D.companies.some(c=>(c.fac||[]).includes(x)));
    if(facGap.length)gap.push(`廠務系統尚未覆蓋 ${facGap.length} 項：${facGap.slice(0,5).join('、')}`);
    const noWin=D.companies.filter(c=>!D.people.some(p=>p.co===c.id));
    if(noWin.length)gap.push(`${noWin.length} 家公司無窗口`);
    if(gap.length)s+=`\n═══ 缺口 ═══\n`+gap.map(g=>'  ・'+g).join('\n')+'\n';
  }

  if(!vs.length&&!lg.length)s+=`\n（這段期間沒有紀錄）\n`;
  return s;
}

  document.getElementById('view').innerHTML={inbox:vInbox,vi:vVi,dr:vDr,co:vCo,pe:vPe,fa:vFa,op:vOp,rp:vRp}[tab]();

function chk(cls){return [...document.querySelectorAll('.'+cls+':checked')].map(e=>e.value)}
function logIt(k,rid,a){
  D.log.push({id:uid('l'),d:new Date().toISOString().slice(0,10),k,rid,a,
    ts:new Date().toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit'})});
  if(D.log.length>2000)D.log=D.log.slice(-2000);
}
function collectA(){const o={};document.querySelectorAll('.v_a').forEach(e=>{o[e.dataset.q]=e.value.trim()});return o}
function val(id){const e=document.getElementById(id);return e?e.value.trim():''}

    D.inbox=D.inbox.filter(x=>x.id!==b.dataset.ibdel);save();render()});

      cap:val('c_cap'),emp:val('c_emp'),rev:val('c_rev'),fac:chk('c_fac'),proc:chk('c_proc'),fabs:chk('c_fb'),

    const isNew=!(edit.co&&edit.co.id);
    if(!isNew)D.companies=D.companies.map(x=>x.id===o.id?o:x);else D.companies.push(o);

    edit.co=null;save();render()};
  if($('coCancel'))$('coCancel').onclick=()=>{edit.co=null;render()};
  document.querySelectorAll('[data-coed]').forEach(b=>b.onclick=()=>{
    edit.co=co(b.dataset.coed);render();window.scrollTo({top:0,behavior:'smooth'})});
  document.querySelectorAll('[data-codel]').forEach(b=>b.onclick=()=>{

    D.companies=D.companies.filter(x=>x.id!==b.dataset.codel);
    D.people.forEach(p=>{if(p.co===b.dataset.codel)p.co=''});save();render()});

  if($('peSave'))$('peSave').onclick=()=>{

    logIt('pe',o.id,isNew?'新增聯絡人':'更新聯絡人');

      navigator.clipboard.writeText(t).then(()=>{const b=$('drCopy');b.textContent='已複製';setTimeout(()=>b.textContent='複製',1200)},
        ()=>{$('drOut').select();document.execCommand('copy')});
    else{$('drOut').select();document.execCommand('copy')}};

  if($('genTxt'))$('genTxt').onclick=()=>{
    let s=`【台積電生態系情報】${new Date().toLocaleDateString('zh-TW')}\n`;
    s+=`\n[廠區 ${D.fabs.length}]\n`+D.fabs.map(f=>` - ${f.name}｜${f.loc}｜${f.node}｜階段:${f.ph}｜量產:${f.mp}\n   標案:${f.buy||'—'}\n   研華:${f.adv||'—'}`).join('\n');
    s+=`\n\n[廠務段公司]\n`+D.companies.filter(isFac).map(c=>{
      const ppl=D.people.filter(p=>p.co===c.id);
      return ` - ${c.name}｜${c.type}｜現用:${c.ipc||'?'}｜研華:${c.adv==='yes'?'是':'否'}\n   系統:${(c.fac||[]).join('、')}\n   下次:${c.next||'—'}｜窗口:${ppl.map(p=>p.name).join('、')||'無'}`}).join('\n');
    s+=`\n\n[製程段公司]\n`+D.companies.filter(isProc).map(c=>
      ` - ${c.name}｜選型:${c.loc||'?'}｜站別:${(c.proc||[]).join('、')}｜OS:${c.os||'?'}`).join('\n');
    s+=`\n\n[機會 ${D.opps.length}]\n`+D.opps.map(o=>{const c=co(o.co),f=fb(o.fa);
      return ` - [${o.sg}] ${o.t}｜${c?c.name:'—'}${f?'／'+f.name:''}｜${o.v||''}\n   下一步:${o.next||'—'}`}).join('\n');
    $('out').value=s;$('out').scrollIntoView({behavior:'smooth',block:'center'})};
}

document.getElementById('bInbox').onclick=()=>{tab='inbox';render();
  setTimeout(()=>{const r=document.getElementById('raw');if(r){r.focus();r.scrollIntoView({block:'center'})}},60)};
document.getElementById('bExp').onclick=()=>{
  const t=JSON.stringify(D);
  if(navigator.clipboard&&navigator.clipboard.writeText)
    navigator.clipboard.writeText(t).then(()=>alert('備份 JSON 已複製'),()=>prompt('複製保存：',t));
  else prompt('複製保存：',t)};
document.getElementById('bImp').onclick=()=>{
  const t=prompt('貼上備份 JSON（或 Claude 產生的解析結果）：');if(!t)return;
  try{const n=JSON.parse(t);
    if(confirm('合併到現有資料？取消＝完全取代'))
      ['inbox','companies','people','fabs','opps','visits','log'].forEach(k=>{if(n[k])D[k]=D[k].concat(n[k])});
    else D=Object.assign({inbox:[],companies:[],people:[],fabs:[],opps:[],visits:[],log:[]},n);
    save();render();alert('匯入完成')}catch(e){alert('格式不正確')}};
(async()=>{await load();render();
  if('serviceWorker' in navigator&&location.protocol==='https:'){
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  }
})();
</script>
</body>
